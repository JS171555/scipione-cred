# Configuração local do Supabase CLI (aplique no projeto hospedado com `supabase config push`
# ou replique manualmente no painel — ver docs/supabase-setup.md).
project_id = "scipione-cred"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false                 # sem cadastro público
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[storage]
enabled = true
file_size_limit = "10MiB"
